name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    # Windows porque o app é feito para ele: a interface (Tkinter) e a proteção da chave da Steam (DPAPI)
    # só são testadas de verdade lá.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Rodar os testes
        run: python -m unittest -v
